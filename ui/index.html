<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lanyard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="floater">
    <div class="card" id="card">
      <div class="tile" id="tile" aria-hidden="true"></div>
      <div class="text" id="text">
        <div
          class="name"
          id="name"
          tabindex="0"
          title="Double-click to rename · drag to move it aside"
        >
          —
        </div>
        <input
          class="rename"
          id="rename"
          hidden
          autocomplete="off"
          spellcheck="false"
          aria-label="Session name"
        />
        <div class="desc" id="desc"></div>
      </div>
      <button class="ghost" id="anchor" title="Move the floater to another corner">
        ⤢
      </button>
    </div>
    <script src="session.js"></script>
    <script src="floater.js"></script>
  </body>
</html>
