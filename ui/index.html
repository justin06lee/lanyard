<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gru</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="floater">
    <div class="pill" id="pill">
      <span class="accent" id="accent" aria-hidden="true"></span>
      <div class="text" id="text">
        <div
          class="name"
          id="name"
          tabindex="0"
          title="Double-click to rename · drag to move it aside"
        >
          —
        </div>
        <input class="rename" id="rename" hidden autocomplete="off" spellcheck="false" />
        <div class="desc" id="desc"></div>
      </div>
      <button class="ghost" id="anchor" title="Move the floater to another corner">⤡</button>
    </div>
    <script src="floater.js"></script>
  </body>
</html>
