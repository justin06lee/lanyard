<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lanyard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="floater">
    <div class="pill" id="pill">
      <span class="name" id="name" title="Double-click to rename · drag to move">—</span>
      <input
        class="rename"
        id="rename"
        hidden
        autocomplete="off"
        spellcheck="false"
        aria-label="Session name"
      />
    </div>
    <!-- Off-screen twin of .name; used to measure the width the pill should be. -->
    <span class="measure" id="measure" aria-hidden="true"></span>
    <script src="floater.js"></script>
  </body>
</html>
