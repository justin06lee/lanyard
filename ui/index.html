<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gru</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="floater">
    <div class="pill" id="pill">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <div class="text">
        <div class="name" id="name" tabindex="0" title="Double-click to rename">—</div>
        <input class="rename" id="rename" hidden autocomplete="off" spellcheck="false" />
        <div class="meta" id="meta"></div>
      </div>
      <button class="ghost" id="anchor" title="Move the floater to another corner">⤡</button>
    </div>
    <script src="floater.js"></script>
  </body>
</html>
