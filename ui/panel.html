<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>gru — sessions</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="panel">
    <header class="panel-head">
      <h1>Claude sessions</h1>
      <span class="count" id="count"></span>
    </header>

    <div class="notice" id="notice" hidden>
      gru needs Accessibility access to see which terminal window is focused.
      <button id="grant">Grant access…</button>
    </div>

    <ul class="rows" id="rows"></ul>
    <p class="empty" id="empty" hidden>No Claude Code sessions running.</p>

    <script src="panel.js"></script>
  </body>
</html>
