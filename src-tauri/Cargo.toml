[package]
name = "lanyard"
version = "0.2.3"
description = "Floating name tags for your Claude Code sessions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lanyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Declared explicitly so bundling can't pick the wrong executable.
[[bin]]
name = "lanyard"
path = "src/main.rs"

[[bin]]
name = "lanyard-doctor"
path = "src/bin/lanyard-doctor.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
