<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- The 16pt/32pt drawing: the clip ring and badge line vanish at these sizes,
       so the figure reduces to its two readable parts — cord and pill. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2C34"/><stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#bg)"/>
  <g fill="none" stroke="url(#strap)" stroke-width="6" stroke-linecap="round">
    <path d="M 20 6 C 21 16, 26 25, 31 31"/>
    <path d="M 44 6 C 43 16, 38 25, 33 31"/>
  </g>
  <rect x="14" y="36" width="36" height="15" rx="7.5" fill="#F2F3F6"/>
</svg>
