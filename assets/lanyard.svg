<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <!-- The problem and the fix in one frame: every window identical, fading
       into the dark — and one of them wearing its name, set in glass, hung
       from a cord. Sharp outer corners; everything inside may curve. -->
  <defs>
    <radialGradient id="vig" cx="38%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#12141b"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c313d" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#181b22" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="url(#vig)"/>

  <!-- the crowd: identical windows, receding -->
  <g>
    <rect x="-40" y="60" width="330" height="250" rx="12" fill="#12141a" stroke="#ffffff" stroke-opacity="0.05"/>
    <circle cx="-6" cy="82" r="5" fill="#ffffff" opacity="0.06"/>
    <circle cx="12" cy="82" r="5" fill="#ffffff" opacity="0.06"/>
    <circle cx="30" cy="82" r="5" fill="#ffffff" opacity="0.06"/>
    <rect x="-16" y="108" width="180" height="9" rx="4.5" fill="#ffffff" opacity="0.045"/>
    <rect x="-16" y="130" width="130" height="9" rx="4.5" fill="#ffffff" opacity="0.045"/>
    <rect x="-16" y="152" width="210" height="9" rx="4.5" fill="#ffffff" opacity="0.045"/>

    <rect x="330" y="30" width="330" height="220" rx="12" fill="#121419" stroke="#ffffff" stroke-opacity="0.045"/>
    <circle cx="356" cy="52" r="5" fill="#ffffff" opacity="0.055"/>
    <circle cx="374" cy="52" r="5" fill="#ffffff" opacity="0.055"/>
    <circle cx="392" cy="52" r="5" fill="#ffffff" opacity="0.055"/>
    <rect x="354" y="78" width="190" height="9" rx="4.5" fill="#ffffff" opacity="0.04"/>
    <rect x="354" y="100" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.04"/>
  </g>

  <!-- the one you're looking at -->
  <g>
    <rect x="100" y="170" width="400" height="330" rx="12" fill="#171a21" stroke="#ffffff" stroke-opacity="0.11"/>
    <circle cx="128" cy="196" r="5.5" fill="#ff5f57" opacity="0.85"/>
    <circle cx="148" cy="196" r="5.5" fill="#febc2e" opacity="0.85"/>
    <circle cx="168" cy="196" r="5.5" fill="#28c840" opacity="0.85"/>
    <rect x="126" y="226" width="240" height="10" rx="5" fill="#ffffff" opacity="0.10"/>
    <rect x="126" y="250" width="170" height="10" rx="5" fill="#ffffff" opacity="0.075"/>
    <rect x="126" y="274" width="290" height="10" rx="5" fill="#ffffff" opacity="0.075"/>
    <rect x="126" y="298" width="120" height="10" rx="5" fill="#ffffff" opacity="0.075"/>
    <rect x="126" y="322" width="260" height="10" rx="5" fill="#ffffff" opacity="0.06"/>
    <rect x="126" y="346" width="200" height="10" rx="5" fill="#ffffff" opacity="0.06"/>
    <rect x="126" y="370" width="150" height="10" rx="5" fill="#ffffff" opacity="0.06"/>
    <rect x="126" y="406" width="14" height="18" rx="3" fill="#0a84ff" opacity="0.75"/>
  </g>

  <!-- the lanyard: cord, ring, and the name in glass -->
  <g>
    <ellipse cx="392" cy="228" rx="110" ry="42" fill="#0a84ff" opacity="0.16" filter="url(#soft)"/>
    <path d="M436 0 C 424 64, 400 104, 392 156" fill="none" stroke="#40454f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="392" cy="166" r="10" fill="none" stroke="#5a5f6c" stroke-width="5"/>
    <rect x="388" y="176" width="8" height="12" rx="3" fill="#5a5f6c"/>
    <rect x="310" y="188" width="164" height="44" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.5"/>
    <rect x="316" y="192" width="152" height="19" rx="9.5" fill="url(#sheen)"/>
    <circle cx="336" cy="210" r="5" fill="#0a84ff"/>
    <text x="352" y="216" fill="#f4f5f7" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.2">makima</text>
  </g>

  <!-- wordmark -->
  <g>
    <text x="565" y="252" fill="#f2f3f5" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Lanyard</text>
    <text x="568" y="290" fill="#8b8e98" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400">every session, wearing its name</text>
  </g>
</svg>
