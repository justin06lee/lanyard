<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150">
  <!-- README illustration: the pill as it renders over a terminal — drawn to
       the same numbers as ui/style.css (30pt capsule, 1px hairline, top
       highlight, soft inner well). -->
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232630"/>
      <stop offset="0.55" stop-color="#15161c"/>
      <stop offset="1" stop-color="#1d2029"/>
    </linearGradient>
    <linearGradient id="glasstint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33363f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22242c" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- a sliver of terminal behind the glass -->
  <rect width="560" height="150" rx="14" fill="url(#desk)"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#3d4351">
    <text x="26" y="34">❯ claude</text>
    <text x="26" y="56">✳ Reworking the session tracker…</text>
    <text x="26" y="78">  └ src-tauri/src/tracker.rs</text>
    <text x="26" y="100">  tests: 13 passed</text>
    <text x="26" y="122">❯</text>
  </g>

  <!-- the pill -->
  <g filter="url(#soft)">
    <rect x="392" y="24" width="132" height="30" rx="15" fill="url(#glasstint)"/>
    <rect x="392.5" y="24.5" width="131" height="29" rx="14.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M 407 25 h 102" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <text x="458" y="43" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#ffffff" fill-opacity="0.97"
        letter-spacing="-0.1">hikmah.chat</text>
</svg>
